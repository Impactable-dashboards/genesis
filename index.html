  <h1>The named list is the <em>spearhead</em>, not the whole <span class=&quot;bl&quot;>motion</span></h1>
  <p class=&quot;lede&quot;>Genesis has done the hard part. There is a named account list, a clear data-leadership buyer, real signal already arriving through the site, a company page with 2,000 followers, and executives already publishing. So this is not net-new acquisition built from scratch. It is a plan to amplify what is already working into one account-based system.</p>

    <div class=&quot;move&quot;><span class=&quot;mn&quot;>Move 01</span><h4>Run the tiered account list as the spearhead</h4><p>Tier-1 launches now as a named account motion. Tier-2 and Tier-3, the hundreds of same-profile enterprises, and the ICP-fit companies already wandering onto the site get their own motion, so the whole thing is not resting on a small set of accounts being ready this quarter.</p><span class=&quot;to&quot;>See the Targeting tab</span></div>

  <div class=&quot;secnum&quot;>DIAGNOSTIC 01 / competitive white space</div>
  <h2 class=&quot;sec&quot;>Everyone ships a <span class=&quot;bl&quot;>copilot</span>. <em>Nobody</em> ships the engineer.</h2>
  <p class=&quot;lede&quot;>Genesis has no exact clone, so a flat competitor list would mislead. The real contest runs on three fronts: the <strong>agentic data-engineering pure-plays</strong> that share the category narrative, the <strong>platform owners</strong> racing to embed agents into the substrate you already run, and the <strong>status quo</strong> of stitched tools plus more people. Ten names, three tiers, each carrying positioning, the real differentiator, the visible limitation, and the strategic take. The through-line: the field sells assistants that suggest while a human still builds, and platforms that lock you to one cloud. The open ground is autonomous execution that runs inside your own data and is paid for in capacity, not seats.</p>

  <div class=&quot;tierlabel tw&quot;><span class=&quot;d&quot;></span>Tier 1 &amp;mdash; Agentic data-engineering pure-plays &amp;middot; share the category and the data-team buyer</div>
  <div class=&quot;grid2&quot;>
    <div class=&quot;card tl&quot;><div class=&quot;tags&quot;><span class=&quot;tag cname&quot;>Ascend.io</span><span class=&quot;tag sz&quot;>~$50M raised</span><span class=&quot;tag&quot;>lock-in: med</span></div>
      <div class=&quot;pos&quot;><b>Positioning.</b> Self-styled leader in agentic data engineering: a unified platform to ingest, transform, orchestrate and observe pipelines, with AI agents that build, monitor and maintain them.</div>
      <div class=&quot;pos&quot;><b>Differentiator.</b> Metadata core plus DataOps Agents (automated incident reporting, first-pass code review, performance tuning), dbt Core integration, headline claims of 10x faster and 75 percent less effort.</div>
      <div class=&quot;pos&quot;><b>Limitation.</b> It is a platform your team adopts and operates; the agents assist inside Ascend's environment. You migrate to a new home and still drive it.</div>
      <div class=&quot;why&quot;><b>Take:</b> the closest owner of the exact category label, competing for the words &quot;agentic data engineering.&quot; Genesis's counter is that its agents run inside the Snowflake or Databricks you already have, rather than a platform you move to.</div></div>
    <div class=&quot;card tl&quot;><div class=&quot;tags&quot;><span class=&quot;tag cname&quot;>Prophecy</span><span class=&quot;tag sz&quot;>~$100M+ raised</span><span class=&quot;tag&quot;>lock-in: med</span></div>
      <div class=&quot;pos&quot;><b>Positioning.</b> The data copilot company: low-code plus generative AI to build and migrate pipelines on Databricks and cloud platforms, for engineers and business users alike.</div>
      <div class=&quot;pos&quot;><b>Differentiator.</b> Visual and low-code plus a compiler plus a copilot; a Migration Copilot for legacy ETL; deep Databricks partnership; democratizes pipeline building for non-engineers.</div>
      <div class=&quot;pos&quot;><b>Limitation.</b> Copilot and human-in-the-loop by design (its own phrase is &quot;designed for humans&quot;); a person still drives the build, and the scope centers on the transformation and integration layer.</div>
      <div class=&quot;why&quot;><b>Take:</b> a well-funded copilot for data transformation. The contrast writes itself: Prophecy helps a human build faster, Genesis completes the mission autonomously.</div></div>
    <div class=&quot;card tl&quot;><div class=&quot;tags&quot;><span class=&quot;tag cname&quot;>dbt Labs (dbt Copilot)</span><span class=&quot;tag&quot;>lock-in: high</span></div>
      <div class=&quot;pos&quot;><b>Positioning.</b> The standard for analytics engineering: transformation-as-code, with dbt Copilot layering AI assistance onto existing dbt projects.</div>
      <div class=&quot;pos&quot;><b>Differentiator.</b> Enormous incumbency and community; the transformation layer most data teams already run; Copilot suggests models, tests and documentation.</div>
      <div class=&quot;pos&quot;><b>Limitation.</b> Scope is the transformation layer, not the full lifecycle; the Copilot assists inside dbt, while ingestion, migration, operations and monitoring live in other tools.</div>
      <div class=&quot;why&quot;><b>Take:</b> less a head-to-head rival than the substrate Genesis works through. Genesis orchestrates dbt, Airflow and Dagster rather than replacing them, and covers the lifecycle dbt does not.</div></div>
    <div class=&quot;card tl&quot;><div class=&quot;tags&quot;><span class=&quot;tag cname&quot;>Acceldata</span><span class=&quot;tag&quot;>lock-in: med</span></div>
      <div class=&quot;pos&quot;><b>Positioning.</b> An agentic data observability and management platform: agents that monitor, diagnose and help resolve data issues across the estate.</div>
      <div class=&quot;pos&quot;><b>Differentiator.</b> Data observability and quality heritage; agentic incident detection and resolution; an enterprise data-management footprint.</div>
      <div class=&quot;pos&quot;><b>Limitation.</b> Centered on observability and operations, watching and fixing, rather than building and migrating pipelines end to end.</div>
      <div class=&quot;why&quot;><b>Take:</b> overlaps Genesis on the &quot;agents fix your pipelines&quot; story but stays in the monitoring lane. Genesis both builds and maintains; Acceldata mostly maintains.</div></div>
  </div>

  <div class=&quot;tierlabel ta&quot;><span class=&quot;d&quot;></span>Tier 2 &amp;mdash; Platform owners with native agents &amp;middot; own the substrate, partners today</div>
  <div class=&quot;grid3&quot;>
    <div class=&quot;card tb&quot;><div class=&quot;tags&quot;><span class=&quot;tag cname&quot;>Databricks</span><span class=&quot;tag sz&quot;>platform owner</span><span class=&quot;tag&quot;>lock-in: very high</span></div>
      <div class=&quot;pos&quot;><b>Positioning.</b> The Data Intelligence Platform. Agent Bricks and Genie bring native agents, ontology and governance to the Lakehouse (more than 100,000 agents built, per the 2026 Data and AI Summit).</div>
      <div class=&quot;pos&quot;><b>Differentiator.</b> Owns the substrate for Lakehouse-standardized accounts; Unity Catalog governance; Genie Ontology for business context; custom-trained data-agent models.</div>
      <div class=&quot;pos&quot;><b>Limitation.</b> Gravity is inside Databricks, strongest when the whole estate is Lakehouse. Most enterprises also run Snowflake, dbt and more, where a single-platform agent does not reach.</div>
      <div class=&quot;why&quot;><b>Take:</b> partner today, substrate competitor tomorrow for Lakehouse-first accounts. Genesis's neutrality, running across Snowflake and Databricks and the existing stack, is the answer to platform gravity.</div></div>
    <div class=&quot;card tb&quot;><div class=&quot;tags&quot;><span class=&quot;tag cname&quot;>Snowflake</span><span class=&quot;tag ex&quot;>investor + partner</span><span class=&quot;tag&quot;>lock-in: very high</span></div>
      <div class=&quot;pos&quot;><b>Positioning.</b> The AI Data Cloud. Cortex Agents, Snowflake Intelligence and Cortex Code position Snowflake as the control plane for the agentic enterprise.</div>
      <div class=&quot;pos&quot;><b>Differentiator.</b> Owns the data cloud many targets already run; native agents on governed Snowflake data. Genesis itself ships as a Snowflake Native App, and Snowflake Ventures is an investor.</div>
      <div class=&quot;pos&quot;><b>Limitation.</b> Cortex is Snowflake-first by design; enterprises with mixed estates need execution that spans beyond Snowflake.</div>
      <div class=&quot;why&quot;><b>Take:</b> the most delicate relationship, investor and distribution channel and overlapping capability at once. Genesis rides Snowflake's rails while staying cross-platform, which is both its moat and its dependency.</div></div>
    <div class=&quot;card tb&quot;><div class=&quot;tags&quot;><span class=&quot;tag cname&quot;>Microsoft Fabric</span><span class=&quot;tag&quot;>lock-in: high</span></div>
      <div class=&quot;pos&quot;><b>Positioning.</b> A unified analytics platform with Copilot across Data Factory, pipelines and analytics, and Fabric IQ and Work IQ as the context and agent layer.</div>
      <div class=&quot;pos&quot;><b>Differentiator.</b> Microsoft estate distribution (Azure, Power BI, Purview); Copilot embedded across the stack; enterprise procurement gravity.</div>
      <div class=&quot;pos&quot;><b>Limitation.</b> Fabric and Azure centric; Copilot assists within Microsoft's surfaces and is less relevant to Snowflake and Databricks-first data teams.</div>
      <div class=&quot;why&quot;><b>Take:</b> a default for Microsoft-committed shops, less so for the Snowflake and Databricks buyer Genesis chases. Overlaps on &quot;Copilot for data,&quot; not on autonomous, in-your-plane execution.</div></div>
  </div>

  <div class=&quot;tierlabel tc&quot;><span class=&quot;d&quot;></span>Tier 3 &amp;mdash; Substitutes for the budget and the status quo</div>
  <div class=&quot;grid3&quot;>
    <div class=&quot;card tt&quot;><div class=&quot;tags&quot;><span class=&quot;tag cname&quot;>Cursor &amp;middot; Copilot &amp;middot; Claude Code</span><span class=&quot;tag&quot;>lock-in: low</span></div>
      <div class=&quot;pos&quot;><b>Positioning.</b> AI that writes code in your repository, fast, and is increasingly pointed at data and pipeline code.</div>
      <div class=&quot;pos&quot;><b>Differentiator.</b> Best-in-class code authoring, enormous developer adoption, cheap and immediate.</div>
      <div class=&quot;pos&quot;><b>Limitation.</b> They see the repository, not your live data. No grasp of schemas, lineage or governance, no testing against production data, single-agent and task-level rather than full-lifecycle.</div>
      <div class=&quot;why&quot;><b>Take:</b> Genesis frames these as complementary, driving them under the hood, and adds the data context, live-data testing, orchestration and in-plane execution they lack. The buyer risk is conflating &quot;writes data code&quot; with &quot;engineers data.&quot;</div></div>
    <div class=&quot;card tt&quot;><div class=&quot;tags&quot;><span class=&quot;tag cname&quot;>Fivetran + dbt + Airflow + Monte Carlo</span><span class=&quot;tag ex&quot;>the status quo</span><span class=&quot;tag&quot;>lock-in: high</span></div>
      <div class=&quot;pos&quot;><b>Positioning.</b> Best-of-breed tools stitched together: ingestion, transformation, orchestration and observability, each operated by people.</div>
      <div class=&quot;pos&quot;><b>Differentiator.</b> Mature, trusted and widely adopted, with each tool strong in its own lane.</div>
      <div class=&quot;pos&quot;><b>Limitation.</b> The stitching and the operating are human labor; the stack does not build, migrate or fix itself, so capacity scales with headcount.</div>
      <div class=&quot;why&quot;><b>Take:</b> the real incumbent Genesis displaces. Not a vendor to out-feature but a status quo to out-economics: one autonomous layer that uses these tools instead of more people to run them.</div></div>
    <div class=&quot;card tt&quot;><div class=&quot;tags&quot;><span class=&quot;tag cname&quot;>SIs &amp;amp; offshore data teams</span><span class=&quot;tag&quot;>lock-in: low</span></div>
      <div class=&quot;pos&quot;><b>Positioning.</b> Buy data-engineering capacity as a service: systems integrators and offshore teams that build and migrate pipelines for a fee.</div>
      <div class=&quot;pos&quot;><b>Differentiator.</b> Flexible capacity, no software to adopt, familiar procurement.</div>
      <div class=&quot;pos&quot;><b>Limitation.</b> Capacity is people, so cost and speed scale linearly; data and intellectual property leave the building; quality and communication lag, and no durable in-house capability is built.</div>
      <div class=&quot;why&quot;><b>Take:</b> the most honest competitor for the same budget line, and the one Genesis's own proof beats directly through hiring plans avoided and data that never leaves. This is where capacity-without-headcount and data-stays-in-house land hardest.</div></div>
  </div>

  <h3 class=&quot;sub&quot;>The field <em>at a glance</em></h3>
  <table>
    <tr><th>Competitor</th><th>Tier</th><th>Positioning</th><th>Key differentiator</th><th style=&quot;text-align:right&quot;>Lock-in</th></tr>
    <tr><td><b>Ascend.io</b></td><td>1</td><td>Agentic data-engineering platform</td><td>Metadata core + DataOps agents</td><td style=&quot;text-align:right&quot;>Medium</td></tr>
    <tr><td><b>Prophecy</b></td><td>1</td><td>Data copilot, low-code + genAI</td><td>Visual + compiler + Migration Copilot</td><td style=&quot;text-align:right&quot;>Medium</td></tr>
    <tr><td><b>dbt Labs</b></td><td>1</td><td>Analytics-engineering standard + Copilot</td><td>Incumbency at the transformation layer</td><td style=&quot;text-align:right&quot;>High</td></tr>
    <tr><td><b>Acceldata</b></td><td>1</td><td>Agentic data observability + management</td><td>Monitoring, diagnosis, resolution</td><td style=&quot;text-align:right&quot;>Medium</td></tr>
    <tr><td><b>Databricks</b></td><td>2</td><td>Lakehouse + Agent Bricks / Genie</td><td>Owns the substrate + governance</td><td style=&quot;text-align:right&quot;>Very High</td></tr>
    <tr><td><b>Snowflake</b></td><td>2</td><td>AI Data Cloud + Cortex Agents</td><td>Control plane + Genesis's own rails</td><td style=&quot;text-align:right&quot;>Very High</td></tr>
    <tr><td><b>Microsoft Fabric</b></td><td>2</td><td>Unified analytics + Copilot</td><td>Microsoft estate distribution</td><td style=&quot;text-align:right&quot;>High</td></tr>
    <tr><td><b>Cursor / Copilot / Claude Code</b></td><td>3</td><td>AI code authoring in the repo</td><td>Best-in-class code generation</td><td style=&quot;text-align:right&quot;>Low</td></tr>
    <tr><td><b>Fivetran + dbt + Airflow + Monte Carlo</b></td><td>3</td><td>The stitched modern data stack</td><td>Mature, trusted, best-of-breed</td><td style=&quot;text-align:right&quot;>High</td></tr>
    <tr><td><b>SIs &amp;amp; offshore</b></td><td>3</td><td>Data engineering as a service</td><td>Flexible human capacity</td><td style=&quot;text-align:right&quot;>Low</td></tr>
  </table>

  <h3 class=&quot;sub&quot;>What <em>everyone</em> is saying</h3>
  <p class=&quot;lede&quot;>Table stakes. Leading here is a losing game because buyers cannot tell vendors apart. The territory to avoid as a headline.</p>
  <table>
    <tr><th>Saturated theme</th><th>Who says it</th><th style=&quot;text-align:right&quot;>Saturation</th></tr>
    <tr><td>10x faster / months to hours</td><td>Ascend &amp;middot; Prophecy &amp;middot; Databricks &amp;middot; Snowflake &amp;middot; Genesis</td><td style=&quot;text-align:right&quot;><span class=&quot;badge b-hi&quot;>High</span></td></tr>
    <tr><td>&quot;AI agents&quot; / &quot;agentic&quot;</td><td>Nearly the entire field</td><td style=&quot;text-align:right&quot;><span class=&quot;badge b-hi&quot;>High</span></td></tr>
    <tr><td>Automate the toil / tedious work</td><td>Ascend &amp;middot; dbt &amp;middot; Acceldata &amp;middot; coding agents</td><td style=&quot;text-align:right&quot;><span class=&quot;badge b-hi&quot;>High</span></td></tr>
    <tr><td>Copilot / assistant that suggests</td><td>Prophecy &amp;middot; dbt &amp;middot; Databricks &amp;middot; Cursor &amp;middot; Copilot</td><td style=&quot;text-align:right&quot;><span class=&quot;badge b-hi&quot;>High</span></td></tr>
    <tr><td>Works with your stack / integrates</td><td>Effectively everyone</td><td style=&quot;text-align:right&quot;><span class=&quot;badge b-hi&quot;>High</span></td></tr>
    <tr><td>Governed / secure / enterprise-grade</td><td>Snowflake &amp;middot; Databricks &amp;middot; Ascend &amp;middot; Microsoft</td><td style=&quot;text-align:right&quot;><span class=&quot;badge b-md&quot;>Med-High</span></td></tr>
    <tr><td>Data quality / observability</td><td>Acceldata &amp;middot; Monte Carlo &amp;middot; Ascend</td><td style=&quot;text-align:right&quot;><span class=&quot;badge b-md&quot;>Medium</span></td></tr>
  </table>

  <h3 class=&quot;sub&quot;>What <em>nobody</em> is saying</h3>
  <p class=&quot;lede&quot;>The uncrowded territory Genesis can own, each lane scored by how many buyers it moves and tied to a specific target and a real proof point. The first three are the ones no competitor can credibly copy.</p>
  <div class=&quot;grid2&quot;>
    <div class=&quot;card tl&quot;><div class=&quot;tags&quot;><span class=&quot;tag&quot;>Gap 01 &amp;middot; core wedge</span><span class=&quot;badge b-hi&quot;>Opportunity: High</span></div>
      <div class=&quot;gaptitle&quot;>Autonomous execution, not a copilot</div>
      <div class=&quot;pos&quot;>The field ships copilots and assistants that suggest code while a human still builds, tests and ships. Nobody else claims to run the whole mission end to end: build the pipeline, test it against live data, open the pull request, monitor it and fix it, with the person setting the goal rather than doing the work. Speaks to the Head of Data Engineering or Director of Data Services drowning in backlog.</div>
      <div class=&quot;why&quot;><b>Evidence:</b> Prophecy and dbt lead with &quot;copilot,&quot; Databricks and Snowflake lead with assistants and chat. Genesis ships commit after commit and months-to-hours delivery (GXS Bank, GrowthZone, Tower Peak).</div></div>
    <div class=&quot;card tb&quot;><div class=&quot;tags&quot;><span class=&quot;tag&quot;>Gap 02 &amp;middot; trust wedge</span><span class=&quot;badge b-hi&quot;>Opportunity: High</span></div>
      <div class=&quot;gaptitle&quot;>Runs inside your data plane, data never leaves</div>
      <div class=&quot;pos&quot;>Platform agents run in the vendor's cloud and coding agents clone your repository into a sandbox. For hedge funds, private equity, banks and pharma, &quot;where does my data go&quot; ends deals. Nobody leads with in-environment execution where the vendor literally cannot see the data. Speaks to data and security leadership in regulated accounts.</div>
      <div class=&quot;why&quot;><b>Evidence:</b> Genesis runs as a Snowflake Native App via Snowpark Container Services and states it cannot see customer data, conversations or metadata; it inherits the customer's existing SOC 2, HIPAA and GDPR posture.</div></div>
    <div class=&quot;card tt&quot;><div class=&quot;tags&quot;><span class=&quot;tag&quot;>Gap 03 &amp;middot; economic wedge</span><span class=&quot;badge b-hi&quot;>Opportunity: High</span></div>
      <div class=&quot;gaptitle&quot;>Capacity without headcount, spoken to the P&amp;amp;L</div>
      <div class=&quot;pos&quot;>Competitors sell speed and features. The real alternative in the buyer's head is &quot;hire more engineers or outsource.&quot; Almost nobody markets directly against the hiring plan or the offshore invoice, which is where the budget actually sits. Speaks to the data leader under headcount and budget pressure.</div>
      <div class=&quot;why&quot;><b style=&quot;color:var(--terra-text)&quot;>Evidence:</b> Genesis's own outcomes are stated in dollars of headcount avoided: a $300K to $450K hiring plan passed on (GrowthZone), five to ten roles avoided (Tower Peak), roughly $200K a year in headcount avoidance (hedge fund).</div></div>
    <div class=&quot;card tl&quot;><div class=&quot;tags&quot;><span class=&quot;tag&quot;>Gap 04 &amp;middot; buyer-identity wedge</span><span class=&quot;badge b-md&quot;>Opportunity: Med/High</span></div>
      <div class=&quot;gaptitle&quot;>The data leader's career upside</div>
      <div class=&quot;pos&quot;>Every rival speaks to the organization: cost, speed, governance. Nobody speaks to the individual who champions the tool, yet the disruptor data leader is chasing a career win, not just a cheaper pipeline. A near-zero-cost message that reframes the whole decision. Speaks to the early-adopter data leader, the real buyer.</div>
      <div class=&quot;why&quot;><b>Evidence:</b> Genesis customers have advanced their careers after adopting it (the prospect's own line, &quot;people get promoted when they hire Genesis&quot;), and a Director of Data Services personally chose Genesis over a $400K hire and got the win.</div></div>
    <div class=&quot;card tt&quot;><div class=&quot;tags&quot;><span class=&quot;tag&quot;>Gap 05 &amp;middot; neutrality wedge</span><span class=&quot;badge b-md&quot;>Opportunity: Med/High</span></div>
      <div class=&quot;gaptitle&quot;>Neutral across Snowflake and Databricks and your existing tools</div>
      <div class=&quot;pos&quot;>The platform owners are racing to be the one place you work, which means lock-in to a single substrate. Enterprises run mixed estates and fear single-vendor gravity, and nobody independent claims to execute across all of it while using the tools you already own. Speaks to multi-platform enterprises avoiding lock-in.</div>
      <div class=&quot;why&quot;><b style=&quot;color:var(--terra-text)&quot;>Evidence:</b> Genesis is a validated partner of both Snowflake and Databricks, integrates dbt, Airflow, Dagster and Fivetran, and deploys as a Snowflake Native App or in a container or VPC across clouds.</div></div>
  </div>

  <h3 class=&quot;sub&quot;>The <em>UVP</em> built from the gap</h3>
  <div class=&quot;callout&quot;><div class=&quot;k&quot;>// the ownable position</div><p><strong>The only autonomous multi-agent data-engineering team that runs inside your own Snowflake or Databricks environment and executes the full pipeline lifecycle end to end.</strong> Months of pipeline work become hours, so enterprises take on more data work without adding headcount, and the data never leaves their walls.</p></div>
  <div class=&quot;grid2&quot;>
    <div class=&quot;card tt&quot;><b style=&quot;color:var(--terra-text)&quot;>Dial back</b>
      <ul class=&quot;clean&quot; style=&quot;margin-top:10px&quot;>
        <li><b>&quot;10x faster / months to hours&quot;</b> as the lead. True, but every platform and copilot says it. Keep it as proof, not the headline.</li>
        <li><b>&quot;AI agents / agentic&quot;</b> as a standalone claim. The most crowded word in the category. Qualify it: autonomous, multi-agent, full-lifecycle execution.</li>
        <li><b>&quot;Works with your stack&quot;</b> as a differentiator. Table stakes. Everyone integrates.</li>
      </ul></div>
    <div class=&quot;card tl&quot;><b style=&quot;color:var(--canopy-text)&quot;>Own</b>
      <ul class=&quot;clean&quot; style=&quot;margin-top:10px&quot;>
        <li><b>Autonomous execution</b>, not a copilot. The mission finishes; the human sets the goal.</li>
        <li><b>Inside your data plane.</b> Data never leaves; compliance inherited.</li>
        <li><b>Capacity without headcount.</b> Priced against the hiring plan, not against features.</li>
        <li><b>Cross-platform neutrality.</b> Snowflake and Databricks and the tools you already run.</li>
        <li><b>Ex-Snowflake pedigree</b>, Snowflake and Databricks validation, Muglia and Kearny Jackson backing.</li>
      </ul></div>
  </div>

  <h3 class=&quot;sub&quot;>Where to <em>attack</em></h3>
  <ul class=&quot;clean&quot;>
    <li><b>Attack the copilots</b> (Prophecy, dbt Copilot, Databricks Assistant, Cursor) on the &quot;it suggests, you still build&quot; axis. Genesis finishes the job.</li>
    <li><b>Attack the platform owners</b> (Snowflake Cortex, Databricks Genie, Microsoft Fabric) on lock-in. Genesis is neutral and runs inside whatever you already have.</li>
    <li><b>Attack the status quo</b> (hire or outsource) on the P&amp;amp;L and on data control: capacity without headcount, and data and intellectual property that never leave the building.</li>
    <li><b>The one move that matters:</b> lead with autonomous execution plus capacity-without-headcount plus the career-upside message, and run a tight account-based motion against the finite list of enterprise data leaders rather than broad reach.</li>
  </ul>

</section>

<div class=&quot;wrap&quot;>
<section class=&quot;view active&quot; id=&quot;targeting&quot;>
  <div class=&quot;secnum&quot;>DIAGNOSTIC 02 / audience targeting</div>
  <h2 class=&quot;sec&quot;>You already know <em>who</em>. This is how we <span class=&quot;bl&quot;>reach</span> them and <span class=&quot;te&quot;>move</span> them.</h2>
  <p class=&quot;lede&quot;>Genesis has done the hard part: a named account list, a clear data-leadership buyer, and real signal already arriving through site traffic, a company-page following, and live search. So this is not a net-new paid acquisition plan built from scratch. It is a plan to <strong>amplify what is already working</strong> and run the named list as a parallel, signal-driven motion. This worksheet maps the whole landscape (who can be served, who is the priority, how each buyer is reached on LinkedIn, what to bid on in search, and which signals build and move the account list) so the account-based work sits inside a system, not on an island.</p>

  <div class=&quot;snum&quot;>01 / target market and priority</div>
  <h3 class=&quot;sub&quot; style=&quot;margin-top:8px&quot;>The market, <em>narrowed</em> to the spearhead</h3>
  <p class=&quot;sublede&quot;>The serviceable substrate is large and growing, but Genesis wins by aiming small. The figures below are third-party estimates that vary by source; the point is directional, and the constraint is aim, not room.</p>
  <div class=&quot;grid4&quot;>
    <div class=&quot;stat b&quot;><div class=&quot;n&quot;>13,300+</div><div class=&quot;l&quot;>Snowflake customers worldwide, the substrate Genesis runs inside (Snowflake FY2026)</div></div>
    <div class=&quot;stat b&quot;><div class=&quot;n&quot;>20,000+</div><div class=&quot;l&quot;>Databricks customers, the second validated substrate, ~60% of the Fortune 500 (Databricks, 2025-26)</div></div>
    <div class=&quot;stat&quot;><div class=&quot;n&quot;>733</div><div class=&quot;l&quot;>Snowflake accounts spending $1M+ a year, the enterprise tier where Genesis's value recovers media cost</div></div>
    <div class=&quot;stat m&quot;><div class=&quot;n&quot;>Tiers 1-3</div><div class=&quot;l&quot;>A tiered named account list of same-profile enterprises. Tier-1 is the tip of the spear; Tier-2 and Tier-3 run in the hundreds behind it.</div></div>
  </div>

  <div class=&quot;funnel&quot;>
    <div class=&quot;fband fb1&quot;><div class=&quot;fb-name&quot;>Serviceable market</div><div class=&quot;fb-scope&quot;>Snowflake or Databricks-committed enterprises with real data-engineering operations</div></div>
    <div class=&quot;fdesc&quot;>Tens of thousands of companies globally. Too broad to sell into directly; it defines the outer edge, not the target.</div>
    <div class=&quot;farrow&quot;>&amp;darr;</div>
    <div class=&quot;fband fb2&quot;><div class=&quot;fb-name&quot;>Priority ICP</div><div class=&quot;fb-scope&quot;>Data-intensive, regulated sectors at enterprise scale in North America</div></div>
    <div class=&quot;fdesc&quot;>Financial services, telecom, pharma and life sciences, and tech, at 501+ employees with a data-engineering backlog. An estimated few thousand accounts.</div>
    <div class=&quot;farrow&quot;>&amp;darr;</div>
    <div class=&quot;fband fb3&quot;><div class=&quot;fb-name&quot;>The spearhead</div><div class=&quot;fb-scope&quot;>Genesis's named account list, Tier-1 first</div></div>
  </div>
  <p class=&quot;figcaption&quot; style=&quot;font-size:12px;color:var(--muted);font-family:'JetBrains Mono';text-align:center;margin-top:2px&quot;>Each band is a subset of the one above it, not a separate audience. Serviceable estimate: inferred, directional. Named list: from Genesis's own account plan.</p>

  <h3 class=&quot;sub&quot;>The data buying <em>committee</em></h3>
  <p class=&quot;sublede&quot;>Inside each target account, four roles decide. Three are reachable with paid targeting; the fourth is an objection to answer, not an audience to buy. ICP here means ideal customer profile.</p>
  <div class=&quot;grid2&quot;>
    <div class=&quot;card tl&quot;><div class=&quot;chhead&quot; style=&quot;display:flex;align-items:center;gap:10px;flex-wrap:wrap&quot;><span class=&quot;ppill pp-primary&quot;>Primary target</span><b style=&quot;font-size:15px;color:var(--ink)&quot;>Economic buyer</b></div>
      <div class=&quot;pos&quot;><b>Who.</b> VP or Head of Data, Chief Data Officer, sometimes the CTO. Owns the data budget and the headcount plan.</div>
      <div class=&quot;pos&quot;><b>Cares about.</b> Adding capacity without adding headcount, delivery speed, risk and compliance, and a defensible spend.</div>
      <div class=&quot;chiprow&quot;><span class=&quot;chip&quot;><span class=&quot;ck&quot;>seniority</span> CXO, VP</span><span class=&quot;chip&quot;><span class=&quot;ck&quot;>function</span> IT, Engineering</span><span class=&quot;chip&quot;><span class=&quot;ck&quot;>title</span> Chief Data Officer, VP of Data</span><span class=&quot;chip&quot;><span class=&quot;ck&quot;>match</span> ABM company list</span></div></div>
    <div class=&quot;card tl&quot;><div class=&quot;chhead&quot; style=&quot;display:flex;align-items:center;gap:10px;flex-wrap:wrap&quot;><span class=&quot;ppill pp-primary&quot;>Primary target</span><b style=&quot;font-size:15px;color:var(--ink)&quot;>Champion</b></div>
      <div class=&quot;pos&quot;><b>Who.</b> Director of Data Engineering, Head of Data Platform or Data Services. The disruptor who brings the tool in.</div>
      <div class=&quot;pos&quot;><b>Cares about.</b> Killing the backlog, doing more with less, and a personal career win for shipping something bold.</div>
      <div class=&quot;chiprow&quot;><span class=&quot;chip&quot;><span class=&quot;ck&quot;>seniority</span> Director</span><span class=&quot;chip&quot;><span class=&quot;ck&quot;>function</span> Engineering, IT</span><span class=&quot;chip&quot;><span class=&quot;ck&quot;>skills</span> Snowflake, Databricks, dbt</span><span class=&quot;chip&quot;><span class=&quot;ck&quot;>title</span> Director of Data Engineering</span></div></div>
    <div class=&quot;card tb&quot;><div class=&quot;chhead&quot; style=&quot;display:flex;align-items:center;gap:10px;flex-wrap:wrap&quot;><span class=&quot;ppill pp-secondary&quot;>Secondary</span><b style=&quot;font-size:15px;color:var(--ink)&quot;>Influencers and users</b></div>
      <div class=&quot;pos&quot;><b>Who.</b> Senior Data Engineers, Data Architects, Platform Engineers. They pressure-test whether it actually works.</div>
      <div class=&quot;pos&quot;><b>Cares about.</b> Whether it augments or replaces them, trust in the output, and fit with the stack they run.</div>
      <div class=&quot;chiprow&quot;><span class=&quot;chip&quot;><span class=&quot;ck&quot;>seniority</span> Senior</span><span class=&quot;chip&quot;><span class=&quot;ck&quot;>function</span> Engineering</span><span class=&quot;chip&quot;><span class=&quot;ck&quot;>skills</span> Airflow, Spark, ETL</span><span class=&quot;chip&quot;><span class=&quot;ck&quot;>message</span> augments, not replaces</span></div></div>
    <div class=&quot;card tc&quot;><div class=&quot;chhead&quot; style=&quot;display:flex;align-items:center;gap:10px;flex-wrap:wrap&quot;><span class=&quot;ppill pp-obj&quot;>Objection to answer</span><b style=&quot;font-size:15px;color:var(--ink)&quot;>Security and governance</b></div>
      <div class=&quot;pos&quot;><b>Who.</b> CISO, Head of Data Governance, procurement. Rarely a productive ad audience; they gate the deal on risk.</div>
      <div class=&quot;pos&quot;><b>Cares about.</b> Where the data goes, vendor access, and compliance posture. The one question that ends deals.</div>
      <div class=&quot;chiprow&quot;><span class=&quot;chip&quot;><span class=&quot;ck&quot;>answer</span> runs inside your data plane</span><span class=&quot;chip&quot;><span class=&quot;ck&quot;>answer</span> data never leaves</span><span class=&quot;chip&quot;><span class=&quot;ck&quot;>answer</span> inherits your compliance</span></div></div>
  </div>

  <div class=&quot;snum&quot;>02 / the audience efficiency ladder</div>
  <h3 class=&quot;sub&quot; style=&quot;margin-top:8px&quot;>Cheapest audiences run <em>first</em></h3>
  <p class=&quot;sublede&quot;>Genesis already has warm pockets, which is what makes this a reframe rather than a cold-start. The rungs below run top to bottom: the cheapest, warmest audiences first, cold native last. Wider bar means higher cost per lead.</p>
  <div class=&quot;ladder2&quot;>
    <div class=&quot;lr&quot;><div class=&quot;lbar lb1&quot;><span class=&quot;lnum&quot;>01</span><span class=&quot;lname&quot;>Warm first-party, bottom of funnel</span><span class=&quot;lcpl&quot;>$75&amp;ndash;150 CPL</span></div>
      <div class=&quot;lpools&quot;><b>Runs first.</b> Salesforce accounts and open deals, named prospects already on the site, demo and pricing-page visitors. Smallest and cheapest to convert.</div></div>
    <div class=&quot;lr&quot;><div class=&quot;lbar lb2&quot;><span class=&quot;lnum&quot;>02</span><span class=&quot;lname&quot;>Warm first-party, mid funnel</span><span class=&quot;lcpl&quot;>$120&amp;ndash;250 CPL</span></div>
      <div class=&quot;lpools&quot;><b>The amplify layer.</b> The ~2,000 company-page followers and post engagers, Thought Leader Ad engagers, and the roughly 2,000 to 3,000 monthly site visitors. This is the traffic already arriving; paid makes it work harder.</div></div>
    <div class=&quot;lr&quot;><div class=&quot;lbar lb3&quot;><span class=&quot;lnum&quot;>03</span><span class=&quot;lname&quot;>In-market search capture</span><span class=&quot;lcpl&quot;>feeds the pools</span></div>
      <div class=&quot;lpools&quot;><b>Already live.</b> The paid search running today, captured and fed back into retargeting. Category, problem, and competitor-conquest terms bring in-market buyers the warm layer then re-engages.</div></div>
    <div class=&quot;lr&quot;><div class=&quot;lbar lb4&quot;><span class=&quot;lnum&quot;>04</span><span class=&quot;lname&quot;>Account-based, the workhorse</span><span class=&quot;lcpl&quot;>$250&amp;ndash;400 CPL</span></div>
      <div class=&quot;lpools&quot;><b>The spearhead motion.</b> The named list uploaded as a Matched Audience, Tier-1 then Tier-2, person-filtered to the buying committee and expanded with fit and timing signals. Runs in parallel with the warm layer, not after it.</div></div>
    <div class=&quot;lr&quot;><div class=&quot;lbar lb5&quot;><span class=&quot;lnum&quot;>05</span><span class=&quot;lname&quot;>Cold LinkedIn, native filters</span><span class=&quot;lcpl&quot;>$300&amp;ndash;600+ CPL</span></div>
      <div class=&quot;lpools&quot;><b>Last, once earned.</b> Broad title and seniority targeting beyond the named list. Longer sales cycle, more budget to warm and convert. Runs only after the tiers above prove out.</div></div>
  </div>
  <div class=&quot;callout&quot;><div class=&quot;k&quot;>// budget shape</div><p>Because warm pools already exist, a <strong>warm-first shape is available on day one</strong>: roughly 60 percent to the warm and amplify layers, 25 percent to the account-based spearhead, 15 percent to a small cold test. Management fee is separate from ad spend. Bands are indicative, not a forecast, and firm up once account access confirms pool sizes.</p></div>

  <div class=&quot;snum&quot;>03 / how the motion works</div>

  <div class=&quot;snum&quot;>05 / the priority segments</div>
  <h3 class=&quot;sub&quot; style=&quot;margin-top:8px&quot;>Three plays, <em>two</em> you launch now</h3>
  <p class=&quot;sublede&quot;>Assembled from the palette above. Two run on day one with no third-party data, and both are recommended to start together: the named-account spearhead and the warm amplification layer. The third expands the list once the first two prove out. Sizes are directional; precise reach is sized in Campaign Manager after each audience is built.</p>

    <div class=&quot;pos&quot;>The tip of the spear. Genesis's own account list becomes the audience, person-filtered to the people who decide. No new data required, because the list already exists.</div>

      <div class=&quot;fr&quot;><div class=&quot;fk&quot;>Source / match</div><div class=&quot;fv&quot;><b>Company list Matched Audience</b>, built from Genesis's named account list. Tier-1 first, Tier-2 second.</div></div>

    </div>
    <div class=&quot;why&quot;><b>Why chase it:</b> a finite named list is exactly why account-based beats broad reach. It puts the message in front of the economic buyer and the champion at the accounts Genesis has already chosen.</div></div>

  <div class=&quot;card tm&quot;><div class=&quot;chhead&quot; style=&quot;display:flex;align-items:center;gap:10px;flex-wrap:wrap&quot;><span class=&quot;ppill pp-primary&quot;>Recommended entry</span><b style=&quot;font-size:16px;color:var(--ink)&quot;>Warm Pocket Amplification</b><span class=&quot;tag on&quot; style=&quot;margin-left:auto&quot;>LinkedIn native, launch now</span></div>

  <div class=&quot;snum&quot;>06 / paid search</div>
  <h3 class=&quot;sub&quot; style=&quot;margin-top:8px&quot;>Search is a <span class=&quot;te&quot;>capture</span> lane, not the engine</h3>
  <p class=&quot;sublede&quot;>Genesis already runs paid search, so this is about shaping it. The category is still emerging, which means head-term volume is thin, and that is good news: it makes search a cheap, high-intent lane to own and defend rather than a volume engine. The demand-creation weight sits with the account motion and content, not here. Volume and cost bands below are directional and firm up with a Keyword Planner pull and account access.</p>
  <div class=&quot;tradeoff&quot;>
    <div class=&quot;tp up&quot;><div class=&quot;tph&quot;>Why this lane is worth it</div><ul>
      <li>Clear intent: the searcher has already decided they need the thing. No demand to create.</li>
      <li>Shorter cycle than any cold audience once the query is specific.</li>
      <li>Self-qualifying queries: the exact term names the problem or a rival.</li>
    </ul></div>
    <div class=&quot;tp catch&quot;><div class=&quot;tph&quot;>The catch</div><ul>
      <li>Category head terms are emerging, so raw volume is thin. Search supplements, it does not carry the plan.</li>
      <li>Broad data-platform terms are costly and contested by Snowflake, Databricks and the incumbents.</li>
      <li>The landing page, not the click, decides the return. Costly clicks punish a generic page.</li>
    </ul></div>
  </div>
  <div class=&quot;grid2&quot;>
    <div class=&quot;card tt&quot;><div class=&quot;tags&quot;><span class=&quot;tag&quot;>Category capture</span></div>
      <div class=&quot;pos&quot;><span class=&quot;ichip i-hi&quot;>Intent: high</span><span class=&quot;ichip i-lo&quot;>Cost: low, emerging</span></div>
      <div class=&quot;kwrap&quot; style=&quot;margin-top:10px&quot;><span class=&quot;kw&quot;>agentic data engineering</span><span class=&quot;kw&quot;>autonomous data pipelines</span><span class=&quot;kw&quot;>AI data engineering agents</span><span class=&quot;kw&quot;>AI data agent</span></div>
      <div class=&quot;why&quot;><b>Own it cheap.</b> The category name is barely contested. Claim it now before the platform owners do.</div></div>
    <div class=&quot;card tt&quot;><div class=&quot;tags&quot;><span class=&quot;tag&quot;>Method and differentiator</span></div>

      <div class=&quot;kwrap&quot; style=&quot;margin-top:10px&quot;><span class=&quot;kw&quot;>reduce data engineering costs</span><span class=&quot;kw&quot;>data engineering without hiring</span><span class=&quot;kw&quot;>automate data pipeline development</span><span class=&quot;kw&quot;>data engineering capacity</span></div>
      <div class=&quot;why&quot;><b>The wedge as search.</b> Capacity without headcount, in the words a budget-pressured leader actually types. Usually the least-contested lane.</div></div>

      <div class=&quot;pos&quot;><span class=&quot;ichip i-hi&quot;>Intent: high</span><span class=&quot;ichip i-md&quot;>Cost: medium</span></div>
      <div class=&quot;kwrap&quot; style=&quot;margin-top:10px&quot;><span class=&quot;kw&quot;>Snowflake pipeline automation</span><span class=&quot;kw&quot;>Databricks migration automation</span><span class=&quot;kw&quot;>automated ETL migration</span><span class=&quot;kw&quot;>SAP to Snowflake migration</span></div>
      <div class=&quot;why&quot;><b>High-value, bid selectively.</b> Migration terms map straight to a Mission with a clear dollar outcome.</div></div>
    <div class=&quot;card tt&quot;><div class=&quot;tags&quot;><span class=&quot;tag&quot;>Competitor conquest</span></div>
      <div class=&quot;pos&quot;><span class=&quot;ichip i-hi&quot;>Intent: high</span><span class=&quot;ichip i-md&quot;>Cost: medium</span></div>
      <div class=&quot;kwrap&quot; style=&quot;margin-top:10px&quot;><span class=&quot;kw&quot;>Ascend.io alternative</span><span class=&quot;kw&quot;>Prophecy alternative</span><span class=&quot;kw&quot;>dbt alternative</span><span class=&quot;kw&quot;>Fivetran alternative</span></div>
      <div class=&quot;why&quot;><b>Catch the shoppers.</b> A researcher comparing tools is in-market. Meet them with the autonomous-execution contrast.</div></div>
    <div class=&quot;card tt&quot;><div class=&quot;tags&quot;><span class=&quot;tag&quot;>Comparison and solution-aware</span></div>
      <div class=&quot;pos&quot;><span class=&quot;ichip i-md&quot;>Intent: medium</span><span class=&quot;ichip i-md&quot;>Cost: medium</span></div>
      <div class=&quot;kwrap&quot; style=&quot;margin-top:10px&quot;><span class=&quot;kw&quot;>best data engineering tools</span><span class=&quot;kw&quot;>data pipeline tools</span><span class=&quot;kw&quot;>AI for data engineering</span></div>
      <div class=&quot;why&quot;><b>Research stage, retarget.</b> These rarely convert on the click. Capture the visit and re-engage through the warm layer.</div></div>
    <div class=&quot;card tt&quot;><div class=&quot;tags&quot;><span class=&quot;tag&quot;>Brand defense</span></div>
      <div class=&quot;pos&quot;><span class=&quot;ichip i-hi&quot;>Intent: high</span><span class=&quot;ichip i-lo&quot;>Cost: low</span></div>
      <div class=&quot;kwrap&quot; style=&quot;margin-top:10px&quot;><span class=&quot;kw&quot;>Genesis Computing</span><span class=&quot;kw&quot;>Genesis data agents</span><span class=&quot;kw&quot;>Genbots</span></div>
      <div class=&quot;why&quot;><b>Cheap and non-negotiable.</b> Defend the brand terms so a competitor cannot buy the last click on Genesis's own name.</div></div>
  </div>
  <div class=&quot;callout h&quot;><div class=&quot;k&quot;>// make or break: the landing page</div><p>Because in-market clicks in this category are expensive, <strong>the page decides the return, not the ad</strong>. A generic homepage wastes costly traffic. Each group needs a matched page: the migration searcher on a migration page, the capacity searcher on a headcount-and-ROI page, the conquest visitor on a head-to-head page. One clear action, proof for that buyer's state of mind, a short fast form. This is exactly where a focused advertiser out-converts bigger spenders on the same click.</p></div>
  <div class=&quot;callout&quot;><div class=&quot;k&quot;>// launch set</div><p><strong>Start with 5 to 6 terms on phrase and exact match:</strong> agentic data engineering, data engineering without hiring, automate data pipeline development, Snowflake migration automation, and one competitor-conquest term. Expand from search-term reports, never from guesses.</p></div>
  <div class=&quot;callout o&quot;><div class=&quot;k&quot;>// negative keywords (brand collisions first)</div><p><strong>The name Genesis collides with many unrelated searches.</strong> Lead the negatives with: Hyundai, car, coupe, GV70, GV80, Sega, console, Bible, church, rehab, energy, and healthcare-facility terms unrelated to data. Then the usual set: jobs, salary, free, tutorial, login, download. Brand-collision negatives protect the brand-defense group from wasting spend on the wrong Genesis.</p></div>

  <div class=&quot;snum&quot;>07 / fit and intent signals</div>
  <h3 class=&quot;sub&quot; style=&quot;margin-top:8px&quot;>Five pools, <em>one</em> scored account view</h3>
  <p class=&quot;sublede&quot;>This is the layer under everything above. DemandSense composes five signal pools into a single account-level view, and Impactable operates it at depth. Enrichment sharpens which accounts join the list and when they are ready. DemandSense and Website Visitor ID are Impactable's own software.</p>

<body>
<header class=&quot;hero&quot;><div class=&quot;container&quot;>
  <div class=&quot;kick&quot;>For Genesis Computing &amp;middot; how it works</div>
  <h1>One motion, with LinkedIn as the <span class=&quot;bl&quot;>hub</span></h1>
  <p class=&quot;lede&quot;>Every channel has a role and an order. LinkedIn is the only one that can see the traffic every other channel produces and qualify it firmographically before spend, which is exactly the retargeting framework you wanted to build and could not get off the ground alone. Here is how each piece works in your account.</p>
</div></header>

<section class=&quot;sec&quot;><div class=&quot;container&quot;>
  <div class=&quot;sk&quot;>The channels, and each one's job</div>
  <h2>Create, Connect, Capture, Extend, <span class=&quot;ms&quot;>Activate</span></h2>
  <div class=&quot;chan&quot;>
    <div class=&quot;c cre&quot;><div class=&quot;ch&quot;><span class=&quot;lbl&quot;>Create</span><h4>The content engine</h4><span class=&quot;tags&quot;>founder-led &amp;middot; the cheapest reach</span></div><p>Monthly interviews with your subject-matter experts, recorded in a virtual studio, become a long-form video, short clips, and posts across executive profiles, the company page, and the blog. We lead the direction and messaging and build a private context engine from the transcripts, so the output stays in your voice and pivots as fast as the product does, without anyone needing to be a data engineer.</p><div class=&quot;why&quot;><b>Job in this account:</b> manufacture the warm audience the category will not sell you cheaply on search, and build the trust that wins deals from bigger competitors.</div></div>
    <div class=&quot;c con&quot;><div class=&quot;ch&quot;><span class=&quot;lbl&quot;>Connect</span><h4>LinkedIn, the account engine</h4><span class=&quot;tags&quot;>qualifies before spend</span></div><p>The named list runs as ABM (account-based marketing), person-filtered to the buying committee. LinkedIn also reads the traffic from content, search, and the site, then filters it by company size, seniority, and function before a dollar is spent. That is the retargeting framework that needs a pool to work, which is why content and a small cold layer build the pool first.</p><div class=&quot;why&quot;><b>Job in this account:</b> qualify every visitor firmographically and run the named list without wasting spend on the wrong titles.</div></div>
    <div class=&quot;c cap&quot;><div class=&quot;ch&quot;><span class=&quot;lbl&quot;>Capture</span><h4>Google, in-market intent</h4><span class=&quot;tags&quot;>the faster cycle</span></div><p>Your category is a premium search lane, so Google is not a traffic engine on its own. It is a focused capture and conquest lane. Roughly 10 to 15 thousand a month pulls in-market searches that LinkedIn then qualifies and retargets over 90 days, which is what turns a costly click into pipeline rather than a bounce. This is the hedge against the ABM wait.</p><div class=&quot;why&quot;><b>Job in this account:</b> bring buyers already looking, on a shorter cycle, and feed the same retargeting pools.</div></div>
    <div class=&quot;c ext&quot;><div class=&quot;ch&quot;><span class=&quot;lbl&quot;>Extend</span><h4>Meta, reach the unmatched</h4><span class=&quot;tags&quot;>inherits the pool</span></div><p>Not every account or person on the list is addressable on LinkedIn. Meta runs the account set in parallel and re-engages the qualified pool at a fraction of the cost per thousand impressions, so coverage becomes a measured number rather than a hope. It inherits the qualified pool, it does not build one, which is why it runs after LinkedIn.</p><div class=&quot;why&quot;><b>Job in this account:</b> cover the buyers LinkedIn cannot match and stretch the retargeting budget further.</div></div>
    <div class=&quot;c act&quot;><div class=&quot;ch&quot;><span class=&quot;lbl&quot;>Activate</span><h4>Outreach on real signal</h4><span class=&quot;tags&quot;>signal, not a cold list</span></div><p>When an account has consumed the 90-day retargeting, or Website Visitor ID names a person, or Trigify catches them engaging organically, that is the moment to reach out. A connect-and-message from the executive's own profile, paired with email, reads as relevant because it follows what they actually did. This complements your Unify and Goji Berry motion rather than replacing it.</p><div class=&quot;why&quot;><b>Job in this account:</b> turn the strongest signals into conversations, and hand named, warmed accounts to your sales team.</div></div>
  </div>
</div></section>

<section class=&quot;sec&quot;><div class=&quot;container&quot;>
  <div class=&quot;sk&quot;>The layer underneath all of it</div>
  <h2>The signal layer that answers <em>who actually clicked</em></h2>
  <p class=&quot;intro&quot;>The hardest problem you named on the call: a thought-leader ad tells you Bank of America engaged and gives you a job title, but not which of the ten directors it was, so outreach lands cold. This is the layer built to solve exactly that.</p>
  <div class=&quot;cols3&quot;>
    <div class=&quot;panel tp&quot;><span class=&quot;pill p-pink&quot;>Name the human</span><h4>Website Visitor ID</h4><p>De-anonymizes the companies and the named people on the site, so the engagement resolves to a person, not a persona. Free for the first 90 days. This is the piece that closes the gap between an ad engagement and a real conversation.</p></div>
    <div class=&quot;panel tb&quot;><span class=&quot;pill p-blue&quot;>Catch the organic</span><h4>Trigify and Sales Navigator</h4><p>Thought-leader ads throw off organic signal that standard LinkedIn ads cannot act on: profile views, new followers, post engagement. Trigify and a Sales Navigator saved search of profile viewers capture it, scraped on a schedule, so the exec can connect with the people who actually viewed them.</p></div>
    <div class=&quot;panel tl&quot;><span class=&quot;pill p-canopy&quot;>Compose it</span><h4>DemandSense, one account view</h4><p>Five signal pools, CRM, LinkedIn paid, LinkedIn organic, companies on site, people on site, composed into one scored view per account, with a next action. This is our own software, so the intelligence is not rented from a dashboard.</p></div>
  </div>
  <div class=&quot;callout&quot;><div class=&quot;k&quot;>// the honest caveat</div><p><b>Reporting is only as good as the conversion capture underneath it.</b> Events and tracking get defined and verified in week one before anything spends, so the account view is built on real data.</p></div>
</div></section>

<section class=&quot;sec&quot;><div class=&quot;container&quot;>
  <div class=&quot;sk&quot;>Closing the loop</div>
  <h2>From ad impression to <span class=&quot;ms&quot;>influenced revenue</span></h2>
  <p class=&quot;intro&quot;>Because Genesis runs Salesforce, the measurement story does not stop at clicks. Campaign Manager cannot see the CRM, so it structurally cannot tell you whether LinkedIn brought a deal. Synced to Salesforce through DemandSense, it can.</p>
  <div class=&quot;cols2&quot;>
    <div class=&quot;panel tl&quot;><span class=&quot;pill p-canopy&quot;>Influenced pipeline</span><ul class=&quot;clean&quot; style=&quot;margin-top:10px&quot;>
      <li>Deals where the account had meaningful ad or content activity before the deal was created, on your real sales-cycle window.</li>
      <li>Which audiences and industries produce pipeline versus only clicks.</li>
      <li>Account journeys tying anonymous site visits back to named companies and then to the deal record.</li>
    </ul></div>
    <div class=&quot;panel tp&quot;><span class=&quot;pill p-pink&quot;>Hidden pipeline</span><ul class=&quot;clean&quot; style=&quot;margin-top:10px&quot;>
      <li>Accounts with heavy engagement and no deal record at all, surfaced automatically and exportable to sales.</li>
      <li>The most useful list in the system for a lean go-to-market team: warm accounts nobody has worked yet.</li>
      <li>Fed straight to the person on your side who works the surfaced accounts.</li>
    </ul></div>
  </div>
  <div class=&quot;video&quot;><iframe src=&quot;https://www.youtube-nocookie.com/embed/7Pqs4jgyZA4&quot; title=&quot;DemandSense influenced revenue walkthrough&quot; loading=&quot;lazy&quot; allowfullscreen></iframe></div>
</div></section>

<section class=&quot;sec&quot;><div class=&quot;container&quot;>
  <div class=&quot;sk&quot;>The conversion philosophy</div>
  <h2>Attention at the cold layer, <span class=&quot;bl&quot;>trust</span> in the middle, action last</h2>
  <p class=&quot;intro&quot;>The reason engaged accounts do not reply to a first email is that the trust threshold has not been crossed. They saw the ad and it caught their attention, but they do not yet know you or view you as the expert. The middle of the funnel exists to fix that, not to hammer them with lead forms.</p>
  <div class=&quot;cols3&quot;>
    <div class=&quot;panel tt&quot;><span class=&quot;pill p-terra&quot;>Cold layer</span><h4>Get attention</h4><p>Direct pain and benefit messaging to the named list and a small cold layer. The job is the first impression, not the conversion. Almost any interaction with a thought-leader ad counts as a click, so these signals get warmed before they get worked.</p></div>
    <div class=&quot;panel tb&quot;><span class=&quot;pill p-blue&quot;>90-day retargeting</span><h4>Build trust</h4><p>Once an account shows interest, 90 days of case studies, testimonials, funding news, and subject-matter expertise, including the vertical-specific proof that makes a hedge-fund story land for a bank. This is where the executive brand does the work.</p></div>
    <div class=&quot;panel tm&quot;><span class=&quot;pill p-moss&quot;>Bottom funnel</span><h4>Earn the action</h4><p>Only after consumption of the trust layer do we push a 30-day lead form or a direct, profile-based outreach, to the accounts that actually engaged. Warm first, ask last.</p></div>
  </div>
</div></section>

<section class=&quot;sec&quot;><div class=&quot;container&quot;>
  <div class=&quot;sk&quot;>How we judge it</div>
  <h2>Measured for a <em>long</em> cycle, not a vanity click</h2>
  <p class=&quot;intro&quot;>A six-to-nine-month enterprise cycle is not judged on booked calls alone in the first 60 days. Booked calls are the goal, but account penetration, persona reach across the committee, and repeat engagement are the leading indicators that show the motion working while pipeline forms.</p>
  <div class=&quot;cols3&quot;>
    <div class=&quot;panel tl&quot;><span class=&quot;pill p-canopy&quot;>Coverage</span><p>What share of the named list and the warm ICP is being reached and engaging, by channel, as counts and percentages of the addressable set.</p></div>
    <div class=&quot;panel tb&quot;><span class=&quot;pill p-blue&quot;>Movement</span><p>Which companies are engaging across multiple persona campaigns, which are moving from aware to active, and which named people Website Visitor ID has surfaced.</p></div>
    <div class=&quot;panel tp&quot;><span class=&quot;pill p-pink&quot;>Deal influence</span><p>Influenced pipeline and hidden pipeline in Salesforce, so spend is judged against deals, not impressions. A program measured on the wrong number looks like failure while it is working.</p></div>
  </div>
</div></section>

  <div class=&quot;kick&quot;>For Genesis Computing &amp;middot; 90-day campaign build</div>
  <h1>What we would <em>launch</em>, by <span class=&quot;bl&quot;>channel</span> and overall</h1>
  <p class=&quot;lede&quot;>Not a strategy you file. A build. This is the campaign architecture we would stand up in the first ninety days, what goes live in each phase, and how every channel is wired into one motion around the LinkedIn account engine.</p>
  <div class=&quot;thesis&quot;><div class=&quot;k&quot;>// the shape in one line</div><p><b>One coordinated motion, hub and spokes.</b> The named account list is the spearhead, the signal layer is the moat, and the content engine keeps every channel fed. LinkedIn qualifies, Google captures, Meta extends reach, outreach converts signal into conversations, and the account view compounds the whole thing every cycle.</p></div>
  <div class=&quot;phases&quot;>
    <div class=&quot;phase p0&quot;><div class=&quot;pn&quot;>Weeks 1 to 2</div><h4>Phase 0 &amp;middot; Foundation</h4><p>Tracking, conversion events, exclusions, list uploads, pool creation. Nothing spends first.</p></div>
    <div class=&quot;phase p1&quot;><div class=&quot;pn&quot;>Month 1</div><h4>Launch</h4><p>Named-account ads, warm retargeting, Thought Leader Ads, brand and high-intent search, the content engine.</p></div>

    <div class=&quot;phase p3&quot;><div class=&quot;pn&quot;>Month 3</div><h4>Convert and optimize</h4><p>The retargeting trust sequence, bottom-of-funnel repositioning, multi-threading engaged accounts, reallocation on real data.</p></div>

<section class=&quot;sec&quot; id=&quot;shape&quot;><div class=&quot;container&quot;>
  <div class=&quot;sk&quot;>The overall structure</div>
  <h2>The whole build on <span class=&quot;bl&quot;>one</span> timeline</h2>
  <p class=&quot;intro&quot;>Every channel has a job and an order. The signal layer runs underneath all of it from day one. Read across a row to see how a channel matures; read down a column to see everything live in that phase.</p>
  <div class=&quot;scrollx&quot;><div class=&quot;gantt&quot;>
    <div class=&quot;gh&quot;></div><div class=&quot;gh&quot;>Phase 0 &amp;middot; wks 1-2</div><div class=&quot;gh&quot;>Month 1</div><div class=&quot;gh&quot;>Month 2</div><div class=&quot;gh&quot;>Month 3</div>

    <div class=&quot;gl&quot;><span class=&quot;dot&quot; style=&quot;background:var(--canopy)&quot;></span>Content engine</div>
    <div class=&quot;bar b-can&quot;>Interview 1, context engine</div>
    <div class=&quot;bar b-can&quot;>Assets live, Thought Leader Ads</div>

    <div class=&quot;bar b-blue&quot;>Named ABM in-feed, coverage, Thought Leader Ads</div>

    <div class=&quot;bar b-blue&quot;>Retargeting trust sequence, bottom-funnel</div>

    <div class=&quot;gl&quot;><span class=&quot;dot&quot; style=&quot;background:var(--terra)&quot;></span>Google capture</div>
    <div class=&quot;bar ghost&quot;>Tracking, negatives</div>
    <div class=&quot;bar b-terra&quot;>Brand plus high-intent core</div>
    <div class=&quot;bar b-terra&quot;>Add competitor conquest</div>
    <div class=&quot;bar b-terra&quot;>Optimize, negatives, scale winners</div>

    <div class=&quot;bar b-clay&quot;>Retarget the qualified pool</div>
    <div class=&quot;bar b-clay&quot;>Scale reach on the pool</div>

    <div class=&quot;gl&quot;><span class=&quot;dot&quot; style=&quot;background:var(--moss)&quot;></span>Outreach</div>

    <div class=&quot;gl&quot;><span class=&quot;dot&quot; style=&quot;background:var(--pink)&quot;></span>Signal layer</div>

  </div></div>
  <p class=&quot;note&quot;>Dashed bars are foundation work that does not spend. The named list is uploadable on day one, so the account motion launches in Month 1 while the site and engagement pools populate underneath it.</p>
</div></section>

<section class=&quot;sec&quot; id=&quot;linkedin&quot;><div class=&quot;container&quot;>
  <div class=&quot;sk&quot;>The hub &amp;middot; where the motion qualifies</div>
  <h2>LinkedIn: the <span class=&quot;bl&quot;>account engine</span></h2>
  <p class=&quot;intro&quot;>LinkedIn is the only channel that filters by company, size, industry, seniority, and function before spend, so it runs the account motion and qualifies everything the other channels produce. The named list is small and precise, so this is an account-based build, not a broad cold audience. Account-list targeting beats title and function guesses here.</p>
  <div class=&quot;settings&quot;>
    <span class=&quot;chip&quot;>Audience Expansion <b>OFF</b></span>
    <span class=&quot;chip&quot;>Audience Network <b>OFF</b></span>
    <span class=&quot;chip&quot;>Manual bidding at launch</span>
    <span class=&quot;chip&quot;>Suppress <b>customers, team, competitors, careers</b></span>
  </div>
  <div class=&quot;dials&quot;>
    <div class=&quot;dial&quot;><div class=&quot;dv&quot;>7-10</div><div class=&quot;dl&quot;>30-day frequency, warm in-feed</div></div>
    <div class=&quot;dial&quot;><div class=&quot;dv&quot;>10-15</div><div class=&quot;dl&quot;>60-day frequency</div></div>
    <div class=&quot;dial&quot;><div class=&quot;dv&quot;>15-25</div><div class=&quot;dl&quot;>90-day frequency, the trust band</div></div>
    <div class=&quot;dial&quot;><div class=&quot;dv&quot;>70-80%</div><div class=&quot;dl&quot;>account penetration target</div></div>
  </div>
  <p class=&quot;note&quot;>Current management theory, tracked at both the 30-day and 90-day window. The named cold layer runs low and wide for penetration, not repetition; the warm and retargeting layer runs to the saturation band above. Below the band, add budget; a penetration plateau near 50 percent at healthy frequency means export and route to Meta, not more spend.</p>

  <h4 style=&quot;font-family:'Archivo Black';font-size:15px;margin:26px 0 4px&quot;>The campaigns, by phase</h4>
  <div class=&quot;scrollx&quot;><div class=&quot;bm&quot;>
    <div class=&quot;h&quot;></div><div class=&quot;h&quot;>Phase 0</div><div class=&quot;h&quot;>Month 1</div><div class=&quot;h&quot;>Month 2</div><div class=&quot;h&quot;>Month 3</div>

    <div class=&quot;r&quot;>Named account in-feed</div>
    <div class=&quot;c dim&quot;><span class=&quot;t&quot;>prep</span>Upload Tier-1 list, personas mapped</div>
    <div class=&quot;c on&quot;><span class=&quot;t&quot;>launch</span>Live to the Tier-1 named list, four persona angles</div>
    <div class=&quot;c on&quot;><span class=&quot;t&quot;>expand</span>Open the Tier-2 finance and healthcare cohort</div>
    <div class=&quot;c on&quot;><span class=&quot;t&quot;>optimize</span>Scale the winning angles, cut the rest</div>

    <div class=&quot;r&quot;>Warm retargeting coverage</div>
    <div class=&quot;c dim&quot;><span class=&quot;t&quot;>prep</span>Pools created, tag collecting</div>
    <div class=&quot;c on&quot;><span class=&quot;t&quot;>launch</span>Spotlight and text coverage on site visitors and followers</div>
    <div class=&quot;c on&quot;><span class=&quot;t&quot;>always on</span>Near-free presence multiplying the in-feed layer</div>
    <div class=&quot;c on&quot;><span class=&quot;t&quot;>always on</span>Segmented as the pools grow</div>

    <div class=&quot;r&quot;>Thought Leader Ads</div>
    <div class=&quot;c dim&quot;><span class=&quot;t&quot;>prep</span>Exec content queued from interviews</div>
    <div class=&quot;c on&quot;><span class=&quot;t&quot;>launch</span>Persona-matched, consolidated into one clean structure</div>
    <div class=&quot;c on&quot;><span class=&quot;t&quot;>fresh</span>New proven posts from the content engine</div>
    <div class=&quot;c on&quot;><span class=&quot;t&quot;>fresh</span>Highest-trust format in the warm layers</div>

    <div class=&quot;r&quot;>Lead generation form</div>
    <div class=&quot;c dim&quot;><span class=&quot;t&quot;>prep</span>Offer and form drafted</div>
    <div class=&quot;c dim&quot;><span class=&quot;t&quot;>held</span>Starts Month 2</div>
    <div class=&quot;c on&quot;><span class=&quot;t&quot;>launch</span>To the broad warm pool, offer testing, faster lead path</div>
    <div class=&quot;c on&quot;><span class=&quot;t&quot;>reposition</span>True bottom-funnel, pointed only at 30-day engagers</div>

    <div class=&quot;r&quot;>Retargeting trust sequence</div>
    <div class=&quot;c dim&quot;><span class=&quot;t&quot;>prep</span>Sequence storyboarded</div>
    <div class=&quot;c dim&quot;><span class=&quot;t&quot;>held</span>Needs a populated pool</div>
    <div class=&quot;c dim&quot;><span class=&quot;t&quot;>queued</span>Building the pool</div>
    <div class=&quot;c on&quot;><span class=&quot;t&quot;>launch</span>In-feed 90-day arc: thought leadership, proof, how-to, results</div>
  </div></div>
  <p class=&quot;note&quot;>Cadence: one new in-feed campaign plus one new dynamic campaign per month, so every report has a launched line and the account stays fresh without fatiguing the audience. Their current one-Thought-Leader-campaign-per-account setup collapses into a single persona-matched structure that actually scales.</p>
</div></section>

<section class=&quot;sec&quot; id=&quot;google&quot;><div class=&quot;container&quot;>
  <div class=&quot;sk&quot;>The capture lane</div>
  <h2>Google: <span class=&quot;te&quot;>capture</span> the in-market intent</h2>
  <p class=&quot;intro&quot;>Google catches the buyers already searching and hands them to LinkedIn to qualify and convert. In a category this specialized the search volume is a cheap, high-intent lane to own outright, not a traffic engine, so it runs lean and precise. Three separated campaigns, never blended, each with its own job.</p>
  <div class=&quot;cols3&quot;>
    <div class=&quot;panel tt&quot;><span class=&quot;pill p-terra&quot;>Always on, capped</span><h4>Brand defense</h4><p>Own the Genesis brand terms so competitors cannot buy in front of your name. Cheap, always on, capped so it never absorbs the core budget.</p></div>
    <div class=&quot;panel tt&quot;><span class=&quot;pill p-terra&quot;>Funded first</span><h4>High-intent core</h4><p>The solution and category terms where the searcher has already decided they need this. Exact and phrase match, tight ad groups, message-matched pages.</p></div>
    <div class=&quot;panel tt&quot;><span class=&quot;pill p-terra&quot;>Conquest</span><h4>Competitor terms</h4><p>Ascend.io, Prophecy, dbt, Acceldata. Comparison intent routed to a page built to win the switch, measured on comparison-page engagement.</p></div>
  </div>
  <h4 style=&quot;font-family:'Archivo Black';font-size:15px;margin:24px 0 8px&quot;>Example high-intent terms</h4>
  <div class=&quot;settings&quot;>
    <span class=&quot;chip&quot;>data engineering without hiring</span>
    <span class=&quot;chip&quot;>Snowflake pipeline automation</span>
    <span class=&quot;chip&quot;>Databricks migration automation</span>
    <span class=&quot;chip&quot;>Ascend.io alternative</span>
    <span class=&quot;chip&quot;>reduce data engineering costs</span>
  </div>
  <div class=&quot;cols2&quot; style=&quot;margin-top:18px&quot;>
    <div class=&quot;panel tl&quot;><span class=&quot;pill p-canopy&quot;>Discipline</span><h4>Four negative lists from day one</h4><ul class=&quot;clean&quot; style=&quot;margin-top:10px&quot;>
      <li><b>Junk and jobs:</b> free, careers, salary, course, template, and the category noise.</li>
      <li><b>Competitor routing:</b> competitor names blocked everywhere except the conquest campaign, so that traffic lands where it is measured.</li>
      <li><b>High-intent tokens</b> route up to the campaign funded to win them.</li>
      <li><b>Learned junk,</b> grown weekly from the search-term review.</li>
    </ul></div>
    <div class=&quot;panel tb&quot;><span class=&quot;pill p-blue&quot;>Why it pays</span><h4>Search feeds the retargeting layer</h4><p>Most first-visit search traffic bounces. Without the follow-up the click was rented, not owned. Every Google visitor drops into the LinkedIn retargeting pool, gets qualified firmographically, and is re-engaged. That is what turns a costly click into pipeline.</p><p>Manual cost-per-click at launch for control, moving to automated bidding only once a conversion baseline exists.</p></div>
  </div>
</div></section>

<section class=&quot;sec&quot; id=&quot;meta&quot;><div class=&quot;container&quot;>
  <div class=&quot;sk&quot;>The reach lane</div>
  <h2>Meta: <span class=&quot;cl&quot;>extend</span> reach on a qualified pool</h2>
  <p class=&quot;intro&quot;>Meta inherits an audience, it cannot qualify one, so it runs after LinkedIn has done the filtering. Its job is coverage: reaching the accounts and people LinkedIn cannot match, and re-engaging the qualified pool at a fraction of the cost per thousand impressions.</p>
  <div class=&quot;cols2&quot;>
    <div class=&quot;panel tc&quot;><span class=&quot;pill p-clay&quot;>Month 1 to 2</span><h4>Account-list reach</h4><p>The full named list runs on Meta in parallel, reaching buyers LinkedIn prices out or cannot serve. A separate, finite retargeting budget sized to a defined account set, not broad prospecting. Coverage becomes a measured number, not a hope.</p></div>
    <div class=&quot;panel tc&quot;><span class=&quot;pill p-clay&quot;>Month 2 onward</span><h4>Retarget the qualified pool</h4><p>Once LinkedIn and the content engine have built a warm, ICP-fit pool, Meta re-engages it cheaply. Layered correctly onto LinkedIn, this is where the blended cost per acquisition drops, roughly 28 percent in our portfolio.</p></div>
  </div>
  <div class=&quot;callout&quot;><div class=&quot;k&quot;>// the gate</div><p><b>Meta only runs against an enriched, qualified pool.</b> We do not open cold Meta prospecting on day one. It earns budget once LinkedIn has proven the audience, which is why the order matters.</p></div>
</div></section>

<section class=&quot;sec&quot; id=&quot;outreach&quot;><div class=&quot;container&quot;>
  <div class=&quot;sk&quot;>Turning signal into conversations</div>
  <h2>Outreach: <span class=&quot;ms&quot;>activate</span> the accounts leaning in</h2>
  <p class=&quot;intro&quot;>The paid motion produces named, scored signal. Outreach acts on it. This is where your existing sequence tooling and Sales Navigator follow-up plug straight in, triggered by what the account actually did rather than a cold list.</p>
  <div class=&quot;cols3&quot;>
    <div class=&quot;panel tm&quot;><span class=&quot;pill p-moss&quot;>Trigger</span><h4>Signal, not a cold list</h4><p>Web ID names the company and person on the site. Ad engagement, content engagement, and Sales Navigator link opens score the account. Outreach fires on the accounts already leaning in.</p></div>
    <div class=&quot;panel tm&quot;><span class=&quot;pill p-moss&quot;>Touch</span><h4>Connect, message, email</h4><p>A signal-triggered LinkedIn connect and message through HeyReach, paired with email nurture. The outreach references what the account viewed, so it reads as relevant, not cold.</p></div>
    <div class=&quot;panel tm&quot;><span class=&quot;pill p-moss&quot;>Compound</span><h4>Multi-thread the committee</h4><p>As more contacts on an account engage, we multi-thread across the buying committee and hand named, warmed accounts to sales, feeding the same account view your team already works.</p></div>
  </div>
  <p class=&quot;note&quot;>This complements your Unify sequences and Sales Navigator Smart Links rather than replacing them. Our signal layer feeds the trigger; your sales motion runs the close. One account view, not two dashboards.</p>
</div></section>

<section class=&quot;sec&quot; id=&quot;content&quot;><div class=&quot;container&quot;>
  <div class=&quot;sk&quot;>The fuel</div>
  <h2>The content engine keeps every channel <em>fed</em></h2>
  <p class=&quot;intro&quot;>Fresh, credible content is what makes the paid layers work and what produces signal no competitor can harvest. We lead the interviews, extract the real expertise, and turn it into assets that supply every channel, month after month.</p>
  <div class=&quot;cols2&quot;>
    <div class=&quot;panel tl&quot;><span class=&quot;pill p-canopy&quot;>Monthly production</span><h4>What we produce every month</h4><ul class=&quot;clean&quot; style=&quot;margin-top:10px&quot;>
      <li><b>One SME interview</b> we lead with a Genesis expert, extracted into a reusable context engine.</li>
      <li><b>One long-form video,</b> roughly six short clips, about a dozen posts, and a newsletter.</li>
      <li><b>Persona-versioned assets</b> that feed Thought Leader Ads and the retargeting sequence.</li>
      <li><b>Published from the company page and exec profiles,</b> even without a personal-brand founder.</li>
    </ul></div>
    <div class=&quot;panel tp&quot;><span class=&quot;pill p-pink&quot;>The double return</span><h4>Content that also produces signal</h4><p>Every piece runs organically and as Thought Leader Ads, roughly three times the click-through rate and about 40 percent lower cost per lead than standard ads.</p><p>The organic engagement it creates is harvested through Trigify and Sales Navigator scraping into the same scored account view. Content becomes reach and signal at once, which is the part no one else runs as one motion.</p></div>
  </div>
</div></section>

<section class=&quot;sec&quot; id=&quot;connect&quot;><div class=&quot;container&quot;>
  <div class=&quot;sk&quot;>The overall structure</div>
  <h2>How it all <span class=&quot;bl&quot;>connects</span></h2>
  <p class=&quot;intro&quot;>Read down a column to see a channel's role at each stage; read across a row to see every channel working a stage together. Accounts earn their way down the funnel through engagement signals, not a calendar. The signal layer under the grid is what moves them.</p>
  <div class=&quot;scrollx&quot;><div class=&quot;eco&quot;>
    <div class=&quot;h&quot;></div>
    <div class=&quot;h&quot;>Content</div><div class=&quot;h&quot;>LinkedIn</div><div class=&quot;h&quot;>Google</div><div class=&quot;h&quot;>Meta</div><div class=&quot;h&quot;>Outreach</div>

    <div class=&quot;rl&quot;>Top of funnel</div>
    <div class=&quot;cell&quot;><b>Create</b>Interviews, posts, video</div>
    <div class=&quot;cell&quot;><b>Named ABM</b>Low, wide reach</div>
    <div class=&quot;cell&quot;><b>Capture</b>High-intent search</div>
    <div class=&quot;cell&quot;><b>Reach</b>Account-list coverage</div>
    <div class=&quot;cell dim&quot;>Watch for signal</div>

    <div class=&quot;rl&quot;>Mid-funnel</div>
    <div class=&quot;cell&quot;><b>Nurture</b>Thought Leader Ads</div>
    <div class=&quot;cell&quot;><b>Retargeting</b>Trust sequence, coverage</div>
    <div class=&quot;cell&quot;><b>Feed</b>Traffic into the pool</div>
    <div class=&quot;cell&quot;><b>Re-engage</b>The qualified pool</div>
    <div class=&quot;cell&quot;><b>Connect</b>On engagement signal</div>

    <div class=&quot;rl&quot;>Bottom of funnel</div>
    <div class=&quot;cell dim&quot;>Proof and case content</div>
    <div class=&quot;cell&quot;><b>Lead form</b>30-day engagers only</div>
    <div class=&quot;cell&quot;><b>Conquest</b>Comparison capture</div>
    <div class=&quot;cell dim&quot;>Suppress converters</div>
    <div class=&quot;cell&quot;><b>Multi-thread</b>Hand to sales</div>
  </div></div>
  <div class=&quot;callout&quot;><div class=&quot;k&quot;>// the loops that compound it</div><p><b>Four loops feed the system back on itself:</b> engagement becomes tomorrow's warm pool, signals sharpen the content and the messaging, CAPI ties revenue back so we optimize on pipeline rather than clicks, and the quarterly Impact Report reallocates budget to what is working. The longer it runs, the sharper it gets.</p></div>
</div></section>

<section class=&quot;sec&quot; id=&quot;day90&quot;><div class=&quot;container&quot;>
  <div class=&quot;sk&quot;>The finish line, and the honest read</div>
  <h2>What <em>launched</em> looks like at day 90</h2>
  <div class=&quot;cols2&quot;>
    <div class=&quot;panel tl&quot;><span class=&quot;pill p-canopy&quot;>Live and running</span><ul class=&quot;clean&quot; style=&quot;margin-top:10px&quot;>
      <li>The named list running on LinkedIn and Meta, persona-split, with a full retargeting trust sequence.</li>
      <li>Brand, high-intent, and competitor search live, feeding the retargeting pool.</li>
      <li>A monthly content engine producing video, clips, posts, and Thought Leader Ads.</li>
      <li>Signal-triggered outreach on the accounts leaning in, multi-threaded into sales.</li>
      <li>One scored account view across every channel, with CAPI tying spend to pipeline.</li>
    </ul></div>
    <div class=&quot;panel tb&quot;><span class=&quot;pill p-blue&quot;>How we judge it</span><p>On a long enterprise cycle, the 60-day read is not booked calls alone. Booked calls are the goal, but account penetration, persona reach across the committee, and repeat engagement are the leading indicators that show the motion working while pipeline forms.</p><p>Each channel is judged by its job: reach and penetration at the top, progression in the middle, pipeline at the bottom, coverage on cost per thousand. A program measured on the wrong number looks like failure while it is working.</p></div>
  </div>
  <div class=&quot;cols2&quot; style=&quot;margin-top:16px&quot;>
    <div class=&quot;panel tm&quot;><span class=&quot;pill p-moss&quot;>Graduation triggers</span><ul class=&quot;clean&quot; style=&quot;margin-top:10px&quot;>
      <li><b>Warm proves out</b> then a cold prospecting segment earns budget.</li>
      <li><b>Penetration plateaus near 50 percent</b> at healthy frequency, so export, enrich, and route to Meta rather than adding spend.</li>
      <li><b>An industry or size clump runs 2 to 3 times</b> the rest, so it earns its own split.</li>
    </ul></div>
    <div class=&quot;panel tt&quot;><span class=&quot;pill p-terra&quot;>Not building yet, on purpose</span><ul class=&quot;clean&quot; style=&quot;margin-top:10px&quot;>
      <li><b>Cold Meta prospecting.</b> Waits for a qualified pool.</li>
      <li><b>Programmatic air cover.</b> A later reach unlock, not a day-one channel.</li>
      <li><b>A second cold segment.</b> Earned after the first proves efficient.</li>
    </ul></div>
  </div>
  <div class=&quot;callout&quot;><div class=&quot;k&quot;>// aim small, earn expansion</div><p><b>We start focused: the named list, warm traffic, and the content engine, run properly.</b> Every layer above is earned by the one below it proving out. That is the opposite of spreading a budget thin across everything at once and hoping.</p></div>
</div></section>

<script>
var FR={"overview":"f-overview","whitespace":"f-whitespace","targeting":"f-targeting","ecosystem":"f-ecosystem","howitworks":"f-howitworks","build":"f-build","paths":"f-paths"};

var DEFAULT='overview';
function curTheme(){return document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';}
function styleFrame(f){
  try{
    var d=f.contentDocument; if(!d) return;
    d.documentElement.setAttribute('data-theme',curTheme());
    if(!d.getElementById('__roominj')){
      var s=d.createElement('style'); s.id='__roominj';
      s.textContent='.nav,.top,#themeBtn,#themeToggle,.tgl{display:none!important}';
      (d.head||d.documentElement).appendChild(s);
    }
  }catch(e){}
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('imp_theme',t);}catch(e){}
  document.querySelectorAll('iframe.frame').forEach(function(f){try{f.contentDocument.documentElement.setAttribute('data-theme',t);}catch(e){}});
  var tb=document.getElementById('themeToggle');if(tb)tb.textContent=t==='dark'?'Light':'Dark';
}
function key(){var h=location.hash.slice(1);return FR[h]?h:DEFAULT;}
function show(k){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.k===k);});
  document.querySelectorAll('iframe.frame').forEach(function(f){f.classList.toggle('active',f.id===FR[k]);});
}
document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){location.hash=t.dataset.k;});});
window.addEventListener('hashchange',function(){show(key());});
document.getElementById('themeToggle').addEventListener('click',function(){applyTheme(curTheme()==='dark'?'light':'dark');});
document.querySelectorAll('iframe.frame').forEach(function(f){f.addEventListener('load',function(){styleFrame(f);});});
applyTheme(curTheme());
show(key());
</script>
